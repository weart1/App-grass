# Leafy production stack for one VPS. Run from this folder:
#   docker compose up -d --build
# Values come from deploy/.env (copy .env.example → .env and fill it in).

name: leafy

services:
  # Our Next.js API. Not exposed to the internet directly — Caddy sits in front.
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://leafy:${POSTGRES_PASSWORD}@postgres:5432/leafy
      REDIS_URL: redis://redis:6379
      AUTH_URL: https://${API_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Database. Data lives in the "pgdata" volume and survives restarts/updates.
  # No "ports:" → reachable only by other containers, not from the internet.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leafy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: leafy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leafy -d leafy']
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache + rate limits (e.g. 10 free scans per day).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'volatile-lru',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Web server in front of the API: gets free HTTPS certificates from
  # Let's Encrypt for API_DOMAIN and renews them automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
