# nginx site for the Leafy API, for servers where nginx already owns ports 80/443.
# Install: copy to /etc/nginx/sites-available/leafy-api, replace API_DOMAIN_HERE,
# link into sites-enabled, then run certbot --nginx -d <domain> for HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN_HERE;

    # Photos are uploaded straight to storage, but allow reasonable JSON bodies.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
